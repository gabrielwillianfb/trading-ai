services:
  postgres:
    image: postgres:16-alpine
    container_name: trading_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trading_ai}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trading_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trading_net

volumes:
  postgres_data:
    name: trading_ai_postgres_data

networks:
  trading_net:
    name: trading_ai_network
    driver: bridge
